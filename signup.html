<!DOCTYPE html>
<html class="scroll-smooth overflow-x-hidden" lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Sign Up | EverVow Officiant Services
  </title>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <script src="https://unpkg.com/lucide@latest">
  </script>
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet"/>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js">
  </script>
  <script src="https://cdn.tailwindcss.com">
  </script>
  <script>
   tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { light: '#D4C5B9', DEFAULT: '#8A7B6E', dark: '#5A4E45', primary: '#2C3E35', secondary: '#D4AF37' },
                        theme: { bg: '#FAF9F6', darkBg: '#121212' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
  </script>
  <style type="text/tailwindcss">
   @layer base {

  html {
    scroll-behavior: smooth;
    @apply antialiased text-gray-800 bg-theme-bg transition-colors duration-300;
  }
  
  html.dark {
    @apply text-gray-100;
  }

  body {
    font-family: 'Inter', sans-serif;
  }

  h1, h2, h3, h4, h5, h6, .font-serif {
    font-family: 'Playfair Display', serif;
  }

  /* RTL Support */
  [dir="rtl"] {
    text-align: right;
  }
  [dir="rtl"] .ml-auto {
    margin-left: 0;
    margin-right: auto;
  }
        }
        @layer components {

  .btn-primary {
    @apply inline-flex items-center justify-center px-8 py-3 text-sm font-medium tracking-wide text-white transition-all duration-300 bg-brand-primary rounded-md hover:bg-brand-dark hover:shadow-lg hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-primary dark:focus:ring-offset-gray-900;
  }

  .btn-secondary {
    @apply inline-flex items-center justify-center px-8 py-3 text-sm font-medium tracking-wide transition-all duration-300 border border-brand-primary text-brand-primary rounded-md hover:bg-brand-primary hover:text-white hover:shadow-md hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-primary dark:border-brand-light dark:text-brand-light dark:hover:bg-brand-light dark:hover:text-gray-900;
  }

  .nav-link {
    @apply text-sm font-medium transition-colors hover:text-brand-primary dark:text-gray-300 dark:hover:text-white relative after:content-[''] after:absolute after:w-full after:scale-x-0 after:h-0.5 after:bottom-0 after:left-0 after:bg-brand-primary after:origin-bottom-right after:transition-transform after:duration-300 hover:after:scale-x-100 hover:after:origin-bottom-left;
  }

  .card {
    @apply bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-sm border border-gray-100 dark:border-gray-700 transition-all duration-300 hover:shadow-xl hover:-translate-y-1;
  }
        }

        @layer utilities {
            .bg-theme-bg { background-color: theme('colors.theme.bg'); }
            .dark .bg-theme-bg { background-color: theme('colors.theme.darkBg'); }
        }
  </style>
  <link href="assets/css/style.css" rel="stylesheet"/>
  <link href="favicon.svg" rel="icon" type="image/svg+xml"/>
 </head>
 <body class="bg-theme-bg text-gray-800 dark:text-gray-200 transition-colors duration-300 antialiased min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative overflow-x-hidden overflow-y-auto">
  <!-- Background Elements -->
  <div class="absolute inset-0 z-0 opacity-30 dark:opacity-10">
   <img alt="Background" class="w-full h-full object-cover" src="https://images.unsplash.com/photo-1469334031218-e382a71b716b?auto=format&amp;fit=crop&amp;w=2000&amp;q=80"/>
  </div>
  <div class="absolute inset-0 z-0 bg-theme-bg/80 dark:bg-gray-900/90 backdrop-blur-sm">
  </div>
  <!-- Theme / Nav controls -->
  <div class="fixed top-4 right-4 sm:top-6 sm:right-6 z-50 flex items-center gap-4 bg-theme-bg/50 dark:bg-gray-900/50 backdrop-blur-sm p-2 rounded-full shadow-sm sm:bg-transparent sm:backdrop-blur-none sm:shadow-none sm:p-0 sm:rounded-none">
   <button aria-label="Toggle Dark Mode" class="theme-toggle p-2 text-gray-500 hover:text-brand-primary dark:text-gray-400 dark:hover:text-white transition-colors">
    <i class="w-5 h-5" data-lucide="moon">
    </i>
   </button>
   <button class="rtl-toggle text-sm font-medium p-2 text-gray-500 hover:text-brand-primary dark:text-gray-400 dark:hover:text-white transition-colors">
    <i class="w-5 h-5" data-lucide="arrow-left-right">
    </i>
   </button>
  </div>
  <div class="max-w-xl w-full relative z-10 bg-white dark:bg-gray-800 p-8 sm:p-10 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-700" data-aos="zoom-in">
   <div class="text-center mb-8">
    <a class="flex-shrink-0 inline-flex items-center gap-2 hover:opacity-80 transition-opacity mb-6 justify-center" href="index.html">
     <i class="w-8 h-8 text-brand-primary dark:text-brand-light" data-lucide="feather">
     </i>
     <span class="font-serif text-2xl font-bold tracking-tight text-gray-900 dark:text-white">
      EverVow
     </span>
    </a>
    <h2 class="text-2xl font-serif text-gray-900 dark:text-white mb-2">
     Create Portal Account
    </h2>
    <p class="text-sm text-gray-500 dark:text-gray-400">
     Join EverVow to start collaborating on your script
    </p>
   </div>
   <form class="space-y-6" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
    <div class="space-y-6">
     <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="firstName">
       First Name
      </label>
      <input class="appearance-none block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-brand-primary focus:border-brand-primary sm:text-sm bg-gray-50 dark:bg-gray-700 dark:text-white transition-colors" id="firstName" name="firstName" required="" type="text"/>
     </div>
     <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="lastName">
       Last Name
      </label>
      <input class="appearance-none block w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-brand-primary focus:border-brand-primary sm:text-sm bg-gray-50 dark:bg-gray-700 dark:text-white transition-colors" id="lastName" name="lastName" required="" type="text"/>
     </div>
    </div>
    <div>
     <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="email">
      Email address
     </label>
     <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
       <i class="h-5 w-5 text-gray-400" data-lucide="mail">
       </i>
      </div>
      <input autocomplete="email" class="appearance-none block w-full pl-10 px-3 py-3 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-brand-primary focus:border-brand-primary sm:text-sm bg-gray-50 dark:bg-gray-700 dark:text-white transition-colors" id="email" name="email" required="" type="email"/>
     </div>
    </div>
    <div class="space-y-6">
     <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="password">
       Password
      </label>
      <div class="relative">
       <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i class="h-5 w-5 text-gray-400" data-lucide="lock">
        </i>
       </div>
       <input class="appearance-none block w-full pl-10 pr-10 px-3 py-3 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-brand-primary focus:border-brand-primary sm:text-sm bg-gray-50 dark:bg-gray-700 dark:text-white transition-colors" id="password" name="password" required="" type="password"/>
       <button class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-brand-primary" onclick="const p=document.getElementById('password'); p.type=p.type==='password'?'text':'password';" type="button">
        <i class="h-5 w-5" data-lucide="eye">
        </i>
       </button>
      </div>
     </div>
     <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2" for="confirm_password">
       Confirm Password
      </label>
      <div class="relative">
       <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <i class="h-5 w-5 text-gray-400" data-lucide="lock-keyhole">
        </i>
       </div>
       <input class="appearance-none block w-full pl-10 pr-10 px-3 py-3 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-brand-primary focus:border-brand-primary sm:text-sm bg-gray-50 dark:bg-gray-700 dark:text-white transition-colors" id="confirm_password" name="confirm_password" required="" type="password"/>
       <button class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-brand-primary" onclick="const p=document.getElementById('confirm_password'); p.type=p.type==='password'?'text':'password';" type="button">
        <i class="h-5 w-5" data-lucide="eye">
        </i>
       </button>
      </div>
     </div>
    </div>
    <div class="flex items-center">
     <input class="h-4 w-4 text-brand-primary focus:ring-brand-primary border-gray-300 rounded cursor-pointer" id="terms" name="terms" required="" type="checkbox"/>
     <label class="ml-2 block text-sm text-gray-700 dark:text-gray-300 cursor-pointer" for="terms">
      I agree to the
      <a class="text-brand-primary dark:text-brand-light hover:underline" href="#">
       Terms &amp; Conditions
      </a>
      and
      <a class="text-brand-primary dark:text-brand-light hover:underline" href="#">
       Privacy Policy
      </a>
     </label>
    </div>
    <div>
     <button class="w-full btn-primary py-3 flex justify-center text-base" type="submit">
      Create Account
     </button>
    </div>
   </form>
   <div class="mt-8">
    <div class="relative">
     <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-gray-300 dark:border-gray-600">
      </div>
     </div>
     <div class="relative flex justify-center text-sm">
      <span class="px-2 bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400">
       Or sign up with
      </span>
     </div>
    </div>
    <div class="mt-6 grid grid-cols-3 gap-3">
     <!-- Social icons identical to login for consistency -->
     <button class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm bg-white dark:bg-gray-700 text-sm font-medium text-gray-500 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-600 hover:shadow-md hover:-translate-y-0.5 hover:text-brand-primary dark:hover:text-brand-light transition-all duration-300" type="button">
      <span class="sr-only">
       Sign up with Google
      </span>
      <svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
       <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z">
       </path>
      </svg>
     </button>
     <button class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm bg-white dark:bg-gray-700 text-sm font-medium text-gray-500 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-600 hover:shadow-md hover:-translate-y-0.5 hover:text-brand-primary dark:hover:text-brand-light transition-all duration-300" type="button">
      <span class="sr-only">
       Sign up with Facebook
      </span>
      <svg class="w-5 h-5" fill="currentColor" viewbox="0 0 20 20">
       <path clip-rule="evenodd" d="M20 10c0-5.523-4.477-10-10-10S0 4.477 0 10c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V10h2.54V7.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V10h2.773l-.443 2.89h-2.33v6.988C16.343 19.128 20 14.991 20 10z" fill-rule="evenodd">
       </path>
      </svg>
     </button>
     <button class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm bg-white dark:bg-gray-700 text-sm font-medium text-gray-500 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-600 hover:shadow-md hover:-translate-y-0.5 hover:text-brand-primary dark:hover:text-brand-light transition-all duration-300" type="button">
      <span class="sr-only">
       Sign up with Apple
      </span>
      <svg class="w-5 h-5" fill="currentColor" viewbox="0 0 20 20">
       <path d="M10.9 2.5c-.7 0-1.6.4-2.1 1-.5.5-.9 1.4-.7 2.1.8 0 1.6-.4 2.1-.9.5-.5.9-1.4.7-2.2zm-2.4 3.7c-1.3-.1-2.4.7-3 1.7-.8 1.4-.8 4.4.6 6.3.7.9 1.5 1.9 2.5 1.8 1-.1 1.4-.7 2.5-.7 1.1 0 1.5.7 2.5.7 1 .1 1.7-.8 2.3-1.8.7-1.1.9-2.1.9-2.2-.1 0-2.1-.8-2.1-3.2 0-2 1.6-2.9 1.7-3-.9-1.3-2.3-1.5-2.8-1.5z">
       </path>
      </svg>
     </button>
    </div>
   </div>
   <p class="mt-8 text-center text-sm text-gray-600 dark:text-gray-400">
    Already have an account?
    <a class="font-medium text-brand-primary dark:text-brand-light hover:underline" href="login.html">
     Sign in
    </a>
   </p>
  </div>
  <script>
   lucide.createIcons();
  </script>
  <script src="assets/js/main.js">
  </script>
 </body>
</html>
